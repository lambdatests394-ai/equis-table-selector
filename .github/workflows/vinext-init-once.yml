name: Initialize vinext for Cloudflare

on:
  push:
    branches:
      - cloudflare-workers
    paths:
      - '.github/workflows/vinext-init-once.yml'

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-workers

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install existing dependencies
        run: npm ci

      - name: Align React for vinext RSC runtime
        run: npm install react@19.3.0 react-dom@19.3.0

      - name: Initialize vinext for Cloudflare Workers
        run: >
          npx --yes vinext@latest init
          --platform=cloudflare
          --skip-check
          --cdn-cache=none
          --data-cache=none
          --image-optimization=none
          --no-prerender

      - name: Build Cloudflare-compatible output
        run: npm run build:vinext

      - name: Keep only source configuration
        shell: bash
        run: |
          rm -rf dist .vinext .cloudflare
          rm -f .github/workflows/vinext-init-once.yml

      - name: Commit vinext configuration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No vinext changes to commit"
            exit 0
          fi
          git commit -m "Initialize vinext for Cloudflare Workers"
          git push origin HEAD:cloudflare-workers
