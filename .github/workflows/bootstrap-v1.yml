name: Bootstrap V1 source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-v1.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .bootstrap/part-*.b64 | base64 --decode > /tmp/equis-v1.zip
          unzip -o /tmp/equis-v1.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v1.yml

      - name: Commit V1 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Equis Table Selector V1 source"
          git push
